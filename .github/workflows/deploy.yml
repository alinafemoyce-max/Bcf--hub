# Tests and builds BCF Hub, NextStep and AthleteOS on every push to main, then publishes them to the
# gh-pages branch, which GitHub Pages serves at:
#   BCF Hub:   https://alinafemoyce-max.github.io/Bcf--hub/
#   NextStep:  https://alinafemoyce-max.github.io/Bcf--hub/nextstep/
#   AthleteOS: https://alinafemoyce-max.github.io/Bcf--hub/athleteos/
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            nextstep/package-lock.json
            athleteos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test and build NextStep
        working-directory: nextstep
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and build AthleteOS
        working-directory: athleteos
        run: |
          npm ci
          npm test
          npm run build
      - run: cp -r nextstep/dist dist/nextstep
      - run: cp -r athleteos/dist dist/athleteos
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
