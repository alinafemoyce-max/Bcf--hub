# Tests and builds AJM Creator Intelligence (creator-intelligence/) on every push that touches it.
# Deployment is handled by Vercel, which builds the app from its own Git integration.
name: Creator Intelligence CI

on:
  push:
    paths: ['creator-intelligence/**', '.github/workflows/creator-intelligence.yml']
  pull_request:
    paths: ['creator-intelligence/**', '.github/workflows/creator-intelligence.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-intelligence
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ajm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-intelligence/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and integration tests (embedded PGlite)
        run: npm test
      - name: Integration tests (real Postgres 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ajm_test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
